name: links
on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 README.md
          fail: true
